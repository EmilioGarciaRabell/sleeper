services:
  redis:
    image: redis:alpine
    container_name: redis_server

  web:
    build: .
    container_name: flask_app
    restart: always
    ports:
      - "5000:5000"
    working_dir: /app/back
    environment:
      - FLASK_ENV=development
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    depends_on:
    - redis

  rq_worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: rq_worker_app
    restart: always
    working_dir: /app/back
    environment:
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - .:/app
    command: rq worker --url redis://redis:6379/0
    depends_on:
      - redis



      