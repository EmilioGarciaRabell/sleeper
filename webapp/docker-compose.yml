services:
  redis:
    image: redis:alpine
    container_name: redis_server
    ports:
      - "6379:6379"

  web:
    build: .
    container_name: flask_app
    restart: always
    ports:
      - "5000:5000"
    working_dir: /app/back
    environment:
      - FLASK_ENV=development
    volumes:
      - .:/app
    depends_on:
      - redis